<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ronaldo vs Messi - Arm Wrestling Live</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080911;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Secret tap area at top of screen to toggle test buttons */
    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 70px; z-index: 100;
    }

    /* --- TOP HEADER & 3X BIGGER PLAYER CARDS --- */
    #top-bar {
      position: absolute; top: 16px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0 12px; z-index: 50; pointer-events: none;
    }

    .player-card {
      width: 155px;
      padding: 14px 8px;
      border-radius: 22px;
      text-align: center;
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    /* Left: Ronaldo (CR7 / Red) */
    .ronaldo-card {
      background: rgba(220, 38, 38, 0.22);
      border: 3.5px solid #ef4444;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.55), inset 0 0 14px rgba(239, 68, 68, 0.2);
    }
    .ronaldo-tag {
      font-size: 11px; font-weight: 900; letter-spacing: 1px;
      background: #dc2626; color: #fff; padding: 3px 8px; border-radius: 6px;
      display: inline-block; margin-bottom: 4px;
    }
    .ronaldo-name {
      font-size: 22px; font-weight: 900; letter-spacing: 0.5px;
      color: #f87171; text-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
    }

    /* Right: Messi (LM10 / Sky Blue) */
    .messi-card {
      background: rgba(56, 189, 248, 0.22);
      border: 3.5px solid #38bdf8;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.55), inset 0 0 14px rgba(56, 189, 248, 0.2);
    }
    .messi-tag {
      font-size: 11px; font-weight: 900; letter-spacing: 1px;
      background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 6px;
      display: inline-block; margin-bottom: 4px;
    }
    .messi-name {
      font-size: 22px; font-weight: 900; letter-spacing: 0.5px;
      color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    /* 3x Bigger Gift Icons & Clear Rules */
    .gift-big-icon {
      font-size: 54px;
      line-height: 1.1;
      margin: 4px 0 2px 0;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }
    .gift-rule-txt {
      font-size: 13px;
      font-weight: 800;
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pull-indicator {
      font-size: 14px;
      font-weight: 900;
      margin: 2px 0 4px 0;
    }
    .pull-red { color: #fca5a5; }
    .pull-blue { color: #bae6fd; }

    .score-badge {
      font-size: 28px;
      font-weight: 900;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 4px;
    }

    /* Center Match Timer */
    #timer-box {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #64748b;
      border-radius: 14px;
      padding: 8px 12px;
      text-align: center;
      color: white;
      margin-top: 10px;
    }
    #timer-label { font-size: 10px; color: #94a3b8; font-weight: 900; letter-spacing: 1px; }
    #timer-display { font-size: 22px; font-weight: 900; color: #f59e0b; }

    /* --- TENSION PROGRESS BAR --- */
    #meter-container {
      position: absolute; top: 245px; left: 4%; width: 92%; height: 26px;
      background: #111827; border-radius: 13px; overflow: hidden;
      display: flex; border: 2.5px solid #334155; z-index: 40;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    #ronaldo-meter {
      width: 50%; height: 100%;
      background: linear-gradient(90deg, #b91c1c, #ef4444);
      transition: width 0.1s ease-out;
    }
    #messi-meter {
      width: 50%; height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.1s ease-out;
    }

    /* Main Game Canvas */
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Victory Banner */
    #winner-banner {
      position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: rgba(11, 15, 30, 0.96); padding: 28px 36px; border-radius: 28px;
      text-align: center; color: white; z-index: 200;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid #f59e0b;
    }
    #winner-title { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
    #winner-sub { font-size: 16px; color: #94a3b8; }

    /* Hidden Testing Panel */
    #test-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; background: rgba(0,0,0,0.85); padding: 10px;
      border-radius: 12px; z-index: 100;
    }
    button {
      border: none; padding: 8px 12px; border-radius: 6px;
      font-weight: 900; cursor: pointer; font-size: 11px;
    }
    .btn-red { background: #ef4444; color: white; }
    .btn-blue { background: #38bdf8; color: black; }
  </style>
</head>
<body>
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <!-- Top Player Cards -->
  <div id="top-bar">
    <!-- RONALDO -->
    <div class="player-card ronaldo-card">
      <div class="ronaldo-tag">CR7</div>
      <div class="ronaldo-name">RONALDO</div>
      <div class="gift-big-icon">🌹</div>
      <div class="gift-rule-txt">1 Rose</div>
      <div class="pull-indicator pull-red">◄ SLAM LEFT</div>
      <div class="score-badge" id="ronaldo-score">0</div>
    </div>

    <!-- Center Timer -->
    <div id="timer-box">
      <div id="timer-label">ARM WRESTLE</div>
      <div id="timer-display">02:00</div>
    </div>

    <!-- MESSI -->
    <div class="player-card messi-card">
      <div class="messi-tag">LM10</div>
      <div class="messi-name">MESSI</div>
      <div class="gift-big-icon">🍩</div>
      <div class="gift-rule-txt">Other Gift</div>
      <div class="pull-indicator pull-blue">SLAM RIGHT ►</div>
      <div class="score-badge" id="messi-score">0</div>
    </div>
  </div>

  <!-- Dynamic Arm Wrestling Tension Meter -->
  <div id="meter-container">
    <div id="ronaldo-meter"></div>
    <div id="messi-meter"></div>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- Victory Banner -->
  <div id="winner-banner">
    <div id="winner-title">🏆 RONALDO PINNED MESSI! SIUUU!</div>
    <div id="winner-sub">Next round starting in 5 seconds...</div>
  </div>

  <!-- Hidden Test Controls -->
  <div id="test-panel">
    <button class="btn-red" onclick="testSlam('ronaldo', 1)">+1 Rose (Ronaldo)</button>
    <button class="btn-red" onclick="testSlam('ronaldo', 20)">+20 Ronaldo</button>
    <button class="btn-blue" onclick="testSlam('messi', 1)">+1 Blue (Messi)</button>
    <button class="btn-blue" onclick="testSlam('messi', 20)">+20 Messi</button>
    <button style="background:#64748b; color:white;" onclick="resetRound()">Reset</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 1080;
    const HEIGHT = 1920;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    // Load High-Res Facial Portraits
    const ronaldoImg = new Image();
    ronaldoImg.crossOrigin = "anonymous";
    ronaldoImg.src = "https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg";

    const messiImg = new Image();
    messiImg.crossOrigin = "anonymous";
    messiImg.src = "https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg";

    // Arm Wrestling State
    // angle: -1.0 (Full Ronaldo slam left) to +1.0 (Full Messi slam right)
    let currentAngle = 0;
    let targetAngle = 0;
    let ronaldoWins = 0;
    let messiWins = 0;
    let roundActive = true;
    let roundTime = 120;
    let shakeIntensity = 0;

    const cheers = []; // Viewer avatar cheers

    // Table Geometry
    const tableY = 1220;
    const tableWidth = 840;
    const tableLeft = (WIDTH - tableWidth) / 2;
    const tableRight = tableLeft + tableWidth;

    // Fixed Elbow Positions on Table Pads
    const ronaldoElbow = { x: 380, y: tableY };
    const messiElbow = { x: 700, y: tableY };

    // Neutral Gripped Hands Position
    const neutralHandX = (ronaldoElbow.x + messiElbow.x) / 2;
    const neutralHandY = tableY - 260;

    // --- MAIN RENDER & ANIMATION LOOP ---
    function update() {
      // Natural effort vibration/tremble
      const tremor = (Math.random() - 0.5) * (0.015 + Math.abs(currentAngle) * 0.02);
      currentAngle += (targetAngle - currentAngle) * 0.12 + tremor;

      // Shake decay
      if (shakeIntensity > 0) shakeIntensity *= 0.9;

      // Check Pins (Threshold = +/- 0.88)
      if (roundActive) {
        if (currentAngle <= -0.88) {
          endRound('RONALDO');
        } else if (currentAngle >= 0.88) {
          endRound('MESSI');
        }
      }

      // Update Meter Bar
      // -1 -> 95% red, +1 -> 5% red
      const redPercent = Math.max(5, Math.min(95, ((1 - currentAngle) / 2) * 100));
      document.getElementById('ronaldo-meter').style.width = `${redPercent}%`;
      document.getElementById('messi-meter').style.width = `${100 - redPercent}%`;

      render();
      requestAnimationFrame(update);
    }

    function render() {
      ctx.save();
      if (shakeIntensity > 0.5) {
        ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
      }

      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // --- 1. ARENA SPOTLIGHTS & BACKGROUND ---
      const grad = ctx.createRadialGradient(WIDTH / 2, tableY - 200, 50, WIDTH / 2, tableY - 200, 700);
      grad.addColorStop(0, 'rgba(30, 41, 59, 0.6)');
      grad.addColorStop(1, 'rgba(8, 9, 17, 1)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // --- 2. SENDER AVATAR POPUP CHEERS ---
      for (let i = cheers.length - 1; i >= 0; i--) {
        const c = cheers[i];
        c.y += c.vy;
        c.life -= 0.016;

        if (c.life <= 0) {
          cheers.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.min(1, c.life * 2);

        // Power beam to wrestler
        ctx.strokeStyle = c.team === 'ronaldo' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.team === 'ronaldo' ? 240 : 840, 780);
        ctx.stroke();

        // Avatar Bubble
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = c.team === 'ronaldo' ? '#ef4444' : '#38bdf8';
        ctx.fill();

        if (c.img && c.img.complete) {
          ctx.save();
          ctx.clip();
          ctx.drawImage(c.img, c.x - c.radius, c.y - c.radius, c.radius * 2, c.radius * 2);
          ctx.restore();
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.name, c.x, c.y - c.radius - 6);
        ctx.restore();
      }

      // --- 3. WRESTLER BODIES & FACES ---
      drawWrestler('ronaldo', 240, 780, ronaldoImg, currentAngle);
      drawWrestler('messi', 840, 780, messiImg, currentAngle);

      // --- 4. ARM WRESTLING COMPETITION TABLE ---
      drawTable();

      // --- 5. FOREARMS & LOCKED HANDS (DYNAMIC SLAM) ---
      drawArmWrestleMechanics();

      ctx.restore();
    }

    // --- DRAW WRESTLER BODY & FACIAL PORTRAIT ---
    function drawWrestler(player, headX, headY, img, angle) {
      ctx.save();

      const isRonaldo = player === 'ronaldo';
      const mainColor = isRonaldo ? '#dc2626' : '#0284c7';
      const secColor = isRonaldo ? '#991b1b' : '#38bdf8';

      // Muscular Torso leaning in
      ctx.fillStyle = mainColor;
      ctx.beginPath();
      if (isRonaldo) {
        ctx.moveTo(headX - 110, headY + 160);
        ctx.lineTo(headX + 90, headY + 130);
        ctx.lineTo(ronaldoElbow.x + 30, tableY + 30);
        ctx.lineTo(headX - 150, tableY + 30);
      } else {
        ctx.moveTo(headX + 110, headY + 160);
        ctx.lineTo(headX - 90, headY + 130);
        ctx.lineTo(messiElbow.x - 30, tableY + 30);
        ctx.lineTo(headX + 150, tableY + 30);
      }
      ctx.closePath();
      ctx.fill();

      // Jersey Number / Trim
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isRonaldo ? '7' : '10', isRonaldo ? headX - 20 : headX + 20, headY + 240);

      // Circular Glowing Face Frame
      const faceRadius = 90;
      ctx.save();
      ctx.beginPath();
      ctx.arc(headX, headY, faceRadius, 0, Math.PI * 2);
      ctx.shadowBlur = 25;
      ctx.shadowColor = mainColor;
      ctx.fillStyle = '#1e293b';
      ctx.fill();

      // Clip portrait image
      if (img && img.complete) {
        ctx.save();
        ctx.clip();
        ctx.drawImage(img, headX - faceRadius, headY - faceRadius, faceRadius * 2, faceRadius * 2);
        ctx.restore();
      } else {
        // Fallback text avatar if CDN slows
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isRonaldo ? 'CR7' : 'LM10', headX, headY + 10);
      }

      // Face Border
      ctx.lineWidth = 6;
      ctx.strokeStyle = mainColor;
      ctx.stroke();
      ctx.restore();

      // Straining Sweat Drops when losing
      const isLosing = (isRonaldo && angle > 0.3) || (!isRonaldo && angle < -0.3);
      if (isLosing) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(headX + (isRonaldo ? 55 : -55), headY - 20, 8, 0, Math.PI * 2);
        ctx.arc(headX + (isRonaldo ? 70 : -70), headY + 30, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // --- DRAW TOURNAMENT TABLE ---
    function drawTable() {
      ctx.save();

      // Table Legs
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(tableLeft + 60, tableY + 50, 40, HEIGHT - tableY);
      ctx.fillRect(tableRight - 100, tableY + 50, 40, HEIGHT - tableY);

      // Metal table base support
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(tableLeft + 20, HEIGHT - 180, tableWidth - 40, 30);

      // Main Table Surface
      const tableGrad = ctx.createLinearGradient(0, tableY, 0, tableY + 50);
      tableGrad.addColorStop(0, '#334155');
      tableGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = tableGrad;
      ctx.fillRect(tableLeft, tableY, tableWidth, 50);

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#475569';
      ctx.strokeRect(tableLeft, tableY, tableWidth, 50);

      // Elbow Pads
      // Ronaldo Elbow Pad (Red)
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(ronaldoElbow.x - 45, tableY - 14, 90, 14);
      ctx.strokeStyle = '#f87171';
      ctx.strokeRect(ronaldoElbow.x - 45, tableY - 14, 90, 14);

      // Messi Elbow Pad (Sky Blue)
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(messiElbow.x - 45, tableY - 14, 90, 14);
      ctx.strokeStyle = '#38bdf8';
      ctx.strokeRect(messiElbow.x - 45, tableY - 14, 90, 14);

      // Touchdown Pin Pads (Where hands slam to score)
      // Left Pin Pad (Ronaldo's win target)
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(tableLeft + 60, tableY - 26, 70, 26);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('CR7 WIN', tableLeft + 68, tableY - 9);

      // Right Pin Pad (Messi's win target)
      ctx.fillStyle = '#0369a1';
      ctx.fillRect(tableRight - 130, tableY - 26, 70, 26);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('LM10 WIN', tableRight - 126, tableY - 9);

      ctx.restore();
    }

    // --- DRAW ARMS & CLASH MECHANICS ---
    function drawArmWrestleMechanics() {
      ctx.save();

      // Hand position calculations
      // Range: max tilt left (currentAngle = -1) -> X=210, Y=tableY-25
      //        max tilt right (currentAngle = +1) -> X=870, Y=tableY-25
      const slamTiltX = currentAngle * 320;
      const slamTiltY = Math.abs(currentAngle) * 210;

      const handX = neutralHandX + slamTiltX;
      const handY = neutralHandY + slamTiltY;

      // 1. Ronaldo's Arm (Portugal Red / Tanned skin)
      drawMuscularArm(ronaldoElbow.x, ronaldoElbow.y, handX, handY, '#fca5a5', '#dc2626', true);

      // 2. Messi's Arm (Argentina Blue / Fair skin)
      drawMuscularArm(messiElbow.x, messiElbow.y, handX, handY, '#fed7aa', '#0284c7', false);

      // 3. Clenched Hands & Grip Flash
      ctx.save();
      ctx.shadowBlur = 30;
      ctx.shadowColor = currentAngle < 0 ? '#ef4444' : '#38bdf8';

      // Energy clash core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(handX, handY, 26, 0, Math.PI * 2);
      ctx.fill();

      // Locked knuckles
      ctx.lineWidth = 5;
      ctx.strokeStyle = currentAngle < 0 ? '#ef4444' : '#38bdf8';
      ctx.stroke();

      // Spark lines at the locked grip
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      for (let s = 0; s < 4; s++) {
        const ang = (Math.PI / 2) * s + Math.random();
        ctx.beginPath();
        ctx.moveTo(handX + Math.cos(ang) * 15, handY + Math.sin(ang) * 15);
        ctx.lineTo(handX + Math.cos(ang) * 40, handY + Math.sin(ang) * 40);
        ctx.stroke();
      }
      ctx.restore();

      ctx.restore();
    }

    function drawMuscularArm(elbowX, elbowY, handX, handY, skinTone, sleeveColor, isLeft) {
      ctx.save();

      // Forearm line / muscle thickness
      ctx.lineCap = 'round';
      ctx.strokeStyle = skinTone;
      ctx.lineWidth = 42;

      ctx.beginPath();
      ctx.moveTo(elbowX, elbowY);
      ctx.lineTo(handX, handY);
      ctx.stroke();

      // Forearm Muscle Outline
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.stroke();

      // Jersey Sleeve at elbow base
      ctx.strokeStyle = sleeveColor;
      ctx.lineWidth = 48;
      ctx.beginPath();
      ctx.moveTo(elbowX, elbowY);
      ctx.lineTo(elbowX + (isLeft ? 30 : -30), elbowY - 20);
      ctx.stroke();

      ctx.restore();
    }

    // --- PUSH / SLAM LOGIC ---
    function triggerSlam(team, coins, name, avatarUrl) {
      if (!roundActive) return;

      shakeIntensity = Math.min(25, 4 + coins * 0.8);

      // Scale power based on coins
      const power = Math.min(0.45, 0.05 * Math.log2(coins + 1) + 0.03);

      if (team === 'ronaldo') {
        targetAngle = Math.max(-1.0, targetAngle - power);
      } else {
        targetAngle = Math.min(1.0, targetAngle + power);
      }

      // Add supporter cheer entity
      const isRonaldo = team === 'ronaldo';
      const spawnX = isRonaldo ? 160 + Math.random() * 140 : 780 + Math.random() * 140;
      const spawnY = 880 + (Math.random() * 140 - 70);

      const cheer = {
        team: team,
        name: name,
        x: spawnX,
        y: spawnY,
        vy: -0.7,
        radius: coins >= 100 ? 46 : 34,
        life: 1.0,
        img: null
      };

      if (avatarUrl) {
        cheer.img = new Image();
        cheer.img.src = avatarUrl;
      }

      cheers.push(cheer);
    }

    // --- ROUND RESOLUTION ---
    function endRound(winner) {
      roundActive = false;
      const banner = document.getElementById('winner-banner');
      const title = document.getElementById('winner-title');

      if (winner === 'RONALDO') {
        ronaldoWins++;
        document.getElementById('ronaldo-score').innerText = ronaldoWins;
        title.innerHTML = '🏆 RONALDO PINNED MESSI! SIUUU! 🇵🇹';
        title.style.color = '#ef4444';
        banner.style.borderColor = '#ef4444';
      } else {
        messiWins++;
        document.getElementById('messi-score').innerText = messiWins;
        title.innerHTML = '🏆 MESSI PINNED RONALDO! ANKARA MESSI! 🇦🇷';
        title.style.color = '#38bdf8';
        banner.style.borderColor = '#38bdf8';
      }

      banner.style.transform = 'translate(-50%, -50%) scale(1)';

      setTimeout(() => {
        resetRound();
      }, 5000);
    }

    function resetRound() {
      const banner = document.getElementById('winner-banner');
      banner.style.transform = 'translate(-50%, -50%) scale(0)';
      targetAngle = 0;
      currentAngle = 0;
      cheers.length = 0;
      roundTime = 120;
      roundActive = true;
    }

    // --- MATCH COUNTDOWN TIMER ---
    setInterval(() => {
      if (!roundActive) return;
      if (roundTime > 0) {
        roundTime--;
        const mins = String(Math.floor(roundTime / 60)).padStart(2, '0');
        const secs = String(roundTime % 60).padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
      } else {
        // Time expired: whichever side has the slam advantage wins
        if (currentAngle < -0.05) endRound('RONALDO');
        else if (currentAngle > 0.05) endRound('MESSI');
        else resetRound();
      }
    }, 1000);

    // Hidden Testing Functions
    window.toggleTestPanel = function() {
      const p = document.getElementById('test-panel');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    };

    window.testSlam = function(team, coins) {
      triggerSlam(team, coins, team.toUpperCase(), null);
    };

    // --- WEBSOCKET EVENT LISTENER ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        const gift = (data.giftName || '').toLowerCase();
        // Rose (1 Coin) pulls for Ronaldo, any other gift pulls for Messi!
        const team = gift.includes('rose') ? 'ronaldo' : 'messi';
        triggerSlam(team, data.diamondCount || 1, data.username, data.avatar);
      }
    };

    update();
  </script>
</body>
</html>
