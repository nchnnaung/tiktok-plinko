<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#d9d9df">
  <title>3Hands - Live Plotter Engraver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #c8c8cf;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      height: 100vh;
      width: 100vw;
    }

    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 100;
    }

    #game-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }

    /* --- TOP BRANDING & GIFT TIERS HUD --- */
    #top-bar {
      position: absolute; top: 18px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0 16px; z-index: 50; pointer-events: none;
    }

    .brand-box {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 6px 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .brand-title {
      font-size: 16px; font-weight: 900; color: #1e293b; letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 10px; font-weight: 700; color: #64748b;
    }

    .live-counter-pill {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 6px 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      text-align: right;
    }
    .counter-title { font-size: 9px; font-weight: 800; color: #64748b; text-transform: uppercase; }
    .counter-num { font-size: 16px; font-weight: 900; color: #2563eb; }

    /* Bottom Gift Badges Guide */
    #gift-guide {
      position: absolute; bottom: 20px; right: 16px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px; padding: 8px 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      z-index: 50; pointer-events: none;
      display: flex; flex-direction: column; gap: 4px;
    }
    .guide-tag {
      font-size: 11px; font-weight: 900; color: #1e293b; display: flex; align-items: center; gap: 6px;
    }
    .guide-tag span { color: #2563eb; }

    /* Offline Secret Test Panel */
    #test-panel {
      position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
      display: none; gap: 6px; background: rgba(15, 23, 42, 0.95); padding: 8px 12px;
      border-radius: 12px; z-index: 150;
    }
    button {
      border: none; padding: 7px 11px; border-radius: 6px;
      font-weight: 900; cursor: pointer; font-size: 11px;
    }
    .btn-fs { background: #22c55e; color: #000; }
    .btn-print { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <!-- Secret Tap Zone at top to reveal offline testing controls -->
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <div id="top-bar">
    <div class="brand-box">
      <div class="brand-title">3Hands Studio ✍️</div>
      <div class="brand-sub">Automated CNC Portrait Plotter</div>
    </div>
    <div class="live-counter-pill">
      <div class="counter-title">Prints Completed</div>
      <div class="counter-num" id="print-counter">0</div>
    </div>
  </div>

  <div id="gift-guide">
    <div class="guide-tag">🌹 1 Rose = <span>Classic Crest</span></div>
    <div class="guide-tag">🍩 30 Coins = <span>Royal Gold Seal</span></div>
    <div class="guide-tag">🎉 100 Coins = <span>Imperial Crown</span></div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="test-panel">
    <button class="btn-fs" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button class="btn-print" onclick="testPrint(0)">Print Arm 1</button>
    <button class="btn-print" onclick="testPrint(1)">Print Arm 2</button>
    <button class="btn-print" onclick="testPrint(2)">Print Arm 3</button>
    <button style="background:#f59e0b; color:#000;" onclick="testPrintRandom()">Auto-Route Gift</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 1080;
    const HEIGHT = 1920;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let totalPrintsCount = 0;
    let animFrame = 0;

    // --- 3 PARALLEL CONVEYOR LANES ---
    const NUM_LANES = 3;
    const MARGIN_X = 50;
    const TOTAL_WIDTH = WIDTH - MARGIN_X * 2;
    const LANE_WIDTH = 290;
    const LANE_SPACING = (TOTAL_WIDTH - LANE_WIDTH * NUM_LANES) / (NUM_LANES - 1);

    const ITEM_HEIGHT = 290;
    const PRINT_Y = 320; // Height where the mechanical toolhead draws

    // Lane States
    const lanes = [];
    for (let i = 0; i < NUM_LANES; i++) {
      const x = MARGIN_X + i * (LANE_WIDTH + LANE_SPACING);
      lanes.push({
        index: i,
        x: x,
        centerX: x + LANE_WIDTH / 2,
        queue: [],
        items: [], // Printed portraits scrolling down
        activeJob: null,
        printProgress: 0,
        scrollOffset: 0,
        targetScrollOffset: 0,
        toolhead: {
          x: x + LANE_WIDTH / 2,
          y: PRINT_Y,
          targetX: x + LANE_WIDTH / 2,
          targetY: PRINT_Y
        }
      });
    }

    // --- MAIN ENGINE LOOP ---
    function update() {
      animFrame++;

      // Process each lane
      for (const lane of lanes) {
        // Smooth conveyor scrolling
        lane.scrollOffset += (lane.targetScrollOffset - lane.scrollOffset) * 0.12;

        // If idle, check for queued prints
        if (!lane.activeJob && lane.queue.length > 0) {
          startPrintingJob(lane, lane.queue.shift());
        }

        // Active Printing Progress
        if (lane.activeJob) {
          lane.printProgress += 0.008; // ~3.5 seconds per print

          // Calculate mechanical toolhead movement around the oval frame
          const drawAngle = lane.printProgress * Math.PI * 14;
          const wobble = Math.sin(drawAngle) * 5;
          const ovalRadiusX = (LANE_WIDTH * 0.32) + wobble;
          const ovalRadiusY = (LANE_WIDTH * 0.38) + wobble;

          lane.toolhead.targetX = lane.centerX + Math.cos(drawAngle) * (ovalRadiusX * Math.min(1, lane.printProgress * 2));
          lane.toolhead.targetY = PRINT_Y + Math.sin(drawAngle) * (ovalRadiusY * Math.min(1, lane.printProgress * 2));

          // Toolhead physics follow
          lane.toolhead.x += (lane.toolhead.targetX - lane.toolhead.x) * 0.25;
          lane.toolhead.y += (lane.toolhead.targetY - lane.toolhead.y) * 0.25;

          // Finished Print
          if (lane.printProgress >= 1.0) {
            completePrintingJob(lane);
          }
        } else {
          // Park toolhead smoothly in neutral position
          lane.toolhead.x += (lane.centerX - lane.toolhead.x) * 0.1;
          lane.toolhead.y += (PRINT_Y - lane.toolhead.y) * 0.1;
        }

        // Prune items that have scrolled off the bottom
        for (let i = lane.items.length - 1; i >= 0; i--) {
          const item = lane.items[i];
          if (item.y + lane.scrollOffset > HEIGHT + 150) {
            lane.items.splice(i, 1);
          }
        }
      }

      render();
      requestAnimationFrame(update);
    }

    function render() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // 1. Studio Concrete/Marble Floor
      const bg = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
      bg.addColorStop(0, '#e8e8ed');
      bg.addColorStop(1, '#c5c5cc');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 2. Draw Top Mechanical Steel Gantry Support Bar
      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 90, WIDTH, 24);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 102, WIDTH, 4);

      // 3. Render 3 Conveyor Paper Rolls & Printed Crests
      for (const lane of lanes) {
        drawConveyorLane(lane);
      }

      // 4. Render 3 Mechanical CNC Toolheads on top
      for (const lane of lanes) {
        drawMechanicalToolhead(lane);
      }
    }

    // --- DRAW PARCHMENT SCROLL & PRINTED PORTRAITS ---
    function drawConveyorLane(lane) {
      ctx.save();

      // Paper Belt Drop Shadow
      ctx.shadowBlur = 24;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
      ctx.fillStyle = '#f8f8fa';
      ctx.fillRect(lane.x, 100, LANE_WIDTH, HEIGHT - 100);
      ctx.restore();

      // Paper Surface Subtle Texture lines
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.03)';
      ctx.lineWidth = 1;
      for (let y = 100; y < HEIGHT; y += 40) {
        ctx.beginPath();
        ctx.moveTo(lane.x, y);
        ctx.lineTo(lane.x + LANE_WIDTH, y);
        ctx.stroke();
      }

      // Paper Lateral Rails
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(lane.x, 100, 6, HEIGHT - 100);
      ctx.fillRect(lane.x + LANE_WIDTH - 6, 100, 6, HEIGHT - 100);

      // Draw Already Printed Portraits (Scrolling Down)
      for (const item of lane.items) {
        const renderY = item.y + lane.scrollOffset;
        if (renderY > 100 && renderY < HEIGHT + 100) {
          drawOrnatePortrait(lane.centerX, renderY, item, 1.0);
        }
      }

      // Draw Currently Printing Portrait
      if (lane.activeJob) {
        const currentY = PRINT_Y;
        drawOrnatePortrait(lane.centerX, currentY, lane.activeJob, lane.printProgress);
      }
    }

    // --- ORNATE ROYAL CREST & INK PORTRAIT DRAWING ---
    function drawOrnatePortrait(x, y, job, progress) {
      ctx.save();

      const themeColor = job.tier === 'gold' ? '#b45309' : (job.tier === 'royal' ? '#1e3a8a' : '#1e293b');
      const accentColor = job.tier === 'gold' ? '#f59e0b' : (job.tier === 'royal' ? '#38bdf8' : '#64748b');

      ctx.save();
      // Clip reveal based on print progress from top to bottom
      if (progress < 0.99) {
        ctx.beginPath();
        ctx.rect(x - LANE_WIDTH / 2, y - 140, LANE_WIDTH, 290 * progress);
        ctx.clip();
      }

      // Outer Ornate Oval Frame
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = themeColor;
      ctx.beginPath();
      ctx.ellipse(x, y, 78, 98, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Inner Beaded Rim
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.ellipse(x, y, 71, 91, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Top Crown / Filigree Emblem
      ctx.fillStyle = accentColor;
      ctx.font = '22px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(job.tier === 'royal' ? '👑' : (job.tier === 'gold' ? '⚜️' : '✦'), x, y - 105);

      // Decorative Laurel Flairs (Left & Right)
      ctx.font = '24px serif';
      ctx.fillText('❧', x - 88, y);
      ctx.fillText('☙', x + 88, y);

      // Sender Circular Avatar (Rendered in Blue/Black Ink Etching)
      const avatarRadius = 52;
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, avatarRadius, 0, Math.PI * 2);
      ctx.clip();

      if (job.img && job.img.complete) {
        ctx.drawImage(job.img, x - avatarRadius, y - avatarRadius, avatarRadius * 2, avatarRadius * 2);

        // Engraving Tint Overlay
        ctx.fillStyle = job.tier === 'gold' ? 'rgba(180, 83, 9, 0.22)' : 'rgba(30, 41, 59, 0.28)';
        ctx.fillRect(x - avatarRadius, y - avatarRadius, avatarRadius * 2, avatarRadius * 2);
      } else {
        // Fallback Monogram
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(x - avatarRadius, y - avatarRadius, avatarRadius * 2, avatarRadius * 2);
        ctx.fillStyle = themeColor;
        ctx.font = '900 36px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(job.username.charAt(0).toUpperCase(), x, y);
      }
      ctx.restore();

      // Avatar Border Ring
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = themeColor;
      ctx.beginPath();
      ctx.arc(x, y, avatarRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Bottom Banner Ribbon for Username
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - 85, y + 96, 170, 26, 6);
      ctx.fill();
      ctx.stroke();

      // Username Text
      ctx.fillStyle = themeColor;
      ctx.font = 'bold 13px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cleanName = job.username.length > 14 ? job.username.substring(0, 13) + '…' : job.username;
      ctx.fillText(`@${cleanName}`, x, y + 109);

      ctx.restore();
      ctx.restore();
    }

    // --- MECHANICAL CNC TOOLHEAD & SUSPENSION ARM ---
    function drawMechanicalToolhead(lane) {
      const hx = lane.toolhead.x;
      const hy = lane.toolhead.y;

      ctx.save();

      // 1. Dual Vertical Linear Guide Shafts (Extending from top gantry down to head)
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(hx - 22, 114);
      ctx.lineTo(hx - 22, hy - 20);
      ctx.moveTo(hx + 22, 114);
      ctx.lineTo(hx + 22, hy - 20);
      ctx.stroke();

      // 2. Extruder / Mechanical Head Carriage Block
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';

      ctx.fillStyle = '#1e293b'; // Gunmetal CNC casing
      ctx.beginPath();
      ctx.roundRect(hx - 36, hy - 36, 72, 42, 8);
      ctx.fill();

      // Brushed Metal Plate Detail
      ctx.fillStyle = '#334155';
      ctx.fillRect(hx - 26, hy - 26, 52, 14);

      // Status LED on Plotter
      ctx.fillStyle = lane.activeJob ? '#22c55e' : '#64748b';
      ctx.beginPath();
      ctx.arc(hx + 22, hy - 26, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // 3. Nozzle Needle / Stylus Pen Tip
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(hx - 7, hy + 6);
      ctx.lineTo(hx + 7, hy + 6);
      ctx.lineTo(hx, hy + 22);
      ctx.closePath();
      ctx.fill();

      // 4. Stylus Active Spark / Ink Glow Tip
      if (lane.activeJob) {
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#38bdf8';
        ctx.fillStyle = '#60a5fa';
        ctx.beginPath();
        ctx.arc(hx, hy + 22, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // --- PRINTING QUEUE & ROUTING ---
    function routeIncomingGift(username, avatarUrl, coins) {
      let tier = 'silver';
      if (coins >= 100) tier = 'royal';
      else if (coins >= 30) tier = 'gold';

      const job = {
        username: username,
        avatarUrl: avatarUrl,
        tier: tier,
        img: null
      };

      if (avatarUrl) {
        job.img = new Image();
        job.img.src = avatarUrl;
      }

      // Pick lane with shortest combined queue & workload
      let bestLane = lanes[0];
      let minLoad = Infinity;

      for (const l of lanes) {
        const load = l.queue.length + (l.activeJob ? 1 : 0);
        if (load < minLoad) {
          minLoad = load;
          bestLane = l;
        }
      }

      bestLane.queue.push(job);
    }

    function startPrintingJob(lane, job) {
      lane.activeJob = job;
      lane.printProgress = 0;
    }

    function completePrintingJob(lane) {
      // Transfer to completed scrolling items
      lane.items.unshift({
        ...lane.activeJob,
        y: PRINT_Y - lane.scrollOffset
      });

      // Shift entire conveyor down by 1 full card distance
      lane.targetScrollOffset += ITEM_HEIGHT;

      lane.activeJob = null;
      lane.printProgress = 0;

      totalPrintsCount++;
      document.getElementById('print-counter').innerText = totalPrintsCount;
    }

    // --- TESTING CONTROLS ---
    window.toggleTestPanel = function() {
      const p = document.getElementById('test-panel');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    };

    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    const mockNames = ['Lissandraa', 'Sofia Fillmon', 'AU', 'REZA', 'Djeki', 'Rin_Stance'];

    window.testPrint = function(laneIndex) {
      const name = mockNames[Math.floor(Math.random() * mockNames.length)];
      lanes[laneIndex].queue.push({
        username: name,
        avatarUrl: null,
        tier: Math.random() > 0.5 ? 'gold' : 'silver',
        img: null
      });
    };

    window.testPrintRandom = function() {
      const name = mockNames[Math.floor(Math.random() * mockNames.length)];
      routeIncomingGift(name, null, 1);
    };

    // --- LIVE WEBSOCKET LISTENER ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        const coins = data.diamondCount || 1;
        routeIncomingGift(data.username, data.avatar, coins);
      }
    };

    update();
  </script>
</body>
</html>
