<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ronaldo vs Messi Live Race</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Impact', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      height: 100vh;
      width: 100vw;
    }

    /* Secret tap area to reveal offline test buttons */
    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 100;
    }

    /* --- THE EXACT PHOTO AS THE LIVE BACKGROUND --- */
    #background-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('/bg.jpg') no-repeat center center;
      background-size: 100% 100%;
      z-index: 1;
    }

    /* --- LIVE COUNTERS OVERLAYING THE IMAGE STATS --- */
    .live-counter {
      position: absolute;
      left: 52%;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1px;
      z-index: 10;
      padding: 0 4px;
    }
    #ronaldo-counter {
      top: 9.8%;
      color: #facc15;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.9), 2px 2px 0px #000;
    }
    #messi-counter {
      top: 59.8%;
      color: #fef08a;
      text-shadow: 0 0 16px rgba(254, 240, 138, 0.9), 2px 2px 0px #000;
    }

    /* --- GIFT RULES MARKED BESIDE PLAYERS --- */
    .gift-box {
      position: absolute;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    /* Beside Ronaldo */
    #ronaldo-rules {
      top: 26%;
      left: 10px;
    }

    /* Beside Messi */
    #messi-rules {
      top: 76%;
      left: 10px;
    }

    .gift-pill {
      background: rgba(11, 15, 30, 0.92);
      border-radius: 12px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      border: 2px solid;
    }

    .pill-ronaldo {
      border-color: #facc15;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }
    .pill-messi {
      border-color: #f472b6;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.4);
    }

    .gift-icon { font-size: 20px; line-height: 1; }
    .gift-name { font-size: 11px; font-weight: 800; color: #cbd5e1; }
    .gift-val { font-size: 12px; font-weight: 900; }
    .val-ronaldo { color: #facc15; }
    .val-messi { color: #f472b6; }

    /* Floating Supporter Goals */
    .goal-popup {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.96);
      padding: 6px 14px;
      border-radius: 20px;
      color: white;
      font-weight: 900;
      font-size: 14px;
      font-family: -apple-system, sans-serif;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 50;
      animation: floatUp 1.8s forwards;
    }
    .popup-ronaldo { border: 2px solid #facc15; }
    .popup-messi { border: 2px solid #f472b6; }
    .goal-popup img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px) scale(0.8); }
      20% { opacity: 1; transform: translateY(0) scale(1.1); }
      80% { opacity: 1; transform: translateY(-40px) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
    }

    /* Victory Banner */
    #winner-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: rgba(11, 15, 30, 0.98); padding: 30px; border-radius: 26px;
      text-align: center; color: white; z-index: 200;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid #facc15; width: 90%;
      font-family: -apple-system, sans-serif;
    }
    #winner-title { font-size: 30px; font-weight: 900; margin-bottom: 8px; }
    #winner-sub { font-size: 16px; color: #94a3b8; }

    /* Hidden Testing Panel */
    #test-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; background: rgba(0,0,0,0.9); padding: 10px;
      border-radius: 12px; z-index: 150;
    }
    button {
      border: none; padding: 8px 12px; border-radius: 6px;
      font-weight: 900; cursor: pointer; font-size: 11px;
    }
    .btn-ronaldo { background: #facc15; color: #000; }
    .btn-messi { background: #f472b6; color: #000; }
  </style>
</head>
<body>
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <!-- Background Poster Graphic -->
  <div id="background-poster"></div>

  <!-- Real-Time Live Counters Overlaid on Graphic -->
  <div class="live-counter" id="ronaldo-counter">979/1000</div>
  <div class="live-counter" id="messi-counter">928/1000</div>

  <!-- Gift Rules Beside Ronaldo -->
  <div class="gift-box" id="ronaldo-rules">
    <div class="gift-pill pill-ronaldo">
      <span class="gift-icon">🌹</span>
      <div>
        <div class="gift-name">1 Rose</div>
        <div class="gift-val val-ronaldo">+1 GOAL</div>
      </div>
    </div>
    <div class="gift-pill pill-ronaldo">
      <span class="gift-icon">🍩</span>
      <div>
        <div class="gift-name">30 Coins</div>
        <div class="gift-val val-ronaldo">+30 GOALS</div>
      </div>
    </div>
  </div>

  <!-- Gift Rules Beside Messi -->
  <div class="gift-box" id="messi-rules">
    <div class="gift-pill pill-messi">
      <span class="gift-icon">⚡</span>
      <div>
        <div class="gift-name">TikTok Logo</div>
        <div class="gift-val val-messi">+1 GOAL</div>
      </div>
    </div>
    <div class="gift-pill pill-messi">
      <span class="gift-icon">🍩</span>
      <div>
        <div class="gift-name">30 Coins</div>
        <div class="gift-val val-messi">+30 GOALS</div>
      </div>
    </div>
  </div>

  <!-- Victory Banner -->
  <div id="winner-banner">
    <div id="winner-title">🏆 1,000 GOALS REACHED!</div>
    <div id="winner-sub">Next round starting in 6 seconds...</div>
  </div>

  <!-- Secret Test Controls -->
  <div id="test-panel">
    <button class="btn-ronaldo" onclick="addGoals('ronaldo', 1, 'Tester')">+1 Rose (CR7)</button>
    <button class="btn-ronaldo" onclick="addGoals('ronaldo', 10, 'Tester')">+10 CR7</button>
    <button class="btn-messi" onclick="addGoals('messi', 1, 'Tester')">+1 Logo (LM10)</button>
    <button class="btn-messi" onclick="addGoals('messi', 10, 'Tester')">+10 LM10</button>
    <button style="background:#475569; color:#fff;" onclick="resetMatch()">Reset</button>
  </div>

  <script>
    const START_RONALDO = 979;
    const START_MESSI = 928;
    const GOAL_TARGET = 1000;

    let ronaldoScore = START_RONALDO;
    let messiScore = START_MESSI;
    let matchActive = true;

    function addGoals(player, amount, username, avatarUrl) {
      if (!matchActive) return;

      if (player === 'ronaldo') {
        ronaldoScore = Math.min(GOAL_TARGET, ronaldoScore + amount);
        document.getElementById('ronaldo-counter').innerText = `${ronaldoScore}/${GOAL_TARGET}`;
        spawnAlert('ronaldo', amount, username, avatarUrl);
        if (ronaldoScore >= GOAL_TARGET) triggerVictory('RONALDO');
      } else {
        messiScore = Math.min(GOAL_TARGET, messiScore + amount);
        document.getElementById('messi-counter').innerText = `${messiScore}/${GOAL_TARGET}`;
        spawnAlert('messi', amount, username, avatarUrl);
        if (messiScore >= GOAL_TARGET) triggerVictory('MESSI');
      }
    }

    function spawnAlert(player, amount, username, avatarUrl) {
      const popup = document.createElement('div');
      popup.className = `goal-popup ${player === 'ronaldo' ? 'popup-ronaldo' : 'popup-messi'}`;

      const imgHtml = avatarUrl ? `<img src="${avatarUrl}">` : '⚽';
      popup.innerHTML = `${imgHtml} <span>${username} scored +${amount} GOAL${amount > 1 ? 'S' : ''}!</span>`;

      popup.style.left = `${25 + Math.random() * 40}%`;
      popup.style.top = player === 'ronaldo' ? `${18 + Math.random() * 15}%` : `${68 + Math.random() * 15}%`;

      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 1800);
    }

    function triggerVictory(winner) {
      matchActive = false;
      const banner = document.getElementById('winner-banner');
      const title = document.getElementById('winner-title');

      if (winner === 'RONALDO') {
        title.innerHTML = '🇵🇹 CRISTIANO RONALDO REACHED 1,000 GOALS! SIUUU! 🐐';
        title.style.color = '#facc15';
        banner.style.borderColor = '#facc15';
      } else {
        title.innerHTML = '🇦🇷 LIONEL MESSI REACHED 1,000 GOALS! GOAT! 🐐';
        title.style.color = '#f472b6';
        banner.style.borderColor = '#f472b6';
      }

      banner.style.transform = 'translate(-50%, -50%) scale(1)';

      setTimeout(() => {
        resetMatch();
      }, 6000);
    }

    function resetMatch() {
      const banner = document.getElementById('winner-banner');
      banner.style.transform = 'translate(-50%, -50%) scale(0)';
      ronaldoScore = START_RONALDO;
      messiScore = START_MESSI;
      document.getElementById('ronaldo-counter').innerText = `${ronaldoScore}/${GOAL_TARGET}`;
      document.getElementById('messi-counter').innerText = `${messiScore}/${GOAL_TARGET}`;
      matchActive = true;
    }

    window.toggleTestPanel = function() {
      const p = document.getElementById('test-panel');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    };

    // --- WEBSOCKET EVENT LISTENER ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        const gift = (data.giftName || '').toLowerCase();
        const coins = data.diamondCount || 1;
        const player = gift.includes('rose') ? 'ronaldo' : 'messi';

        let addedGoals = coins;
        if (coins >= 1000) addedGoals = 1000;

        addGoals(player, addedGoals, data.username, data.avatar);
      }
    };
  </script>
</body>
</html>
