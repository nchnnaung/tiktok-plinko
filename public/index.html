<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ronaldo vs Messi - TikTok Live Tug of War</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080911;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Secret tap area at top of screen to toggle test buttons */
    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 70px; z-index: 100;
    }

    /* --- TOP HEADER & 3X BIGGER PLAYER CARDS --- */
    #top-bar {
      position: absolute; top: 18px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0 12px; z-index: 50; pointer-events: none;
    }

    .player-card {
      width: 155px; /* 3x expanded card footprint */
      padding: 14px 8px;
      border-radius: 22px;
      text-align: center;
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    /* Left Side: Ronaldo (CR7 / Red & Gold) */
    .ronaldo-card {
      background: rgba(220, 38, 38, 0.22);
      border: 3.5px solid #ef4444;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.55), inset 0 0 14px rgba(239, 68, 68, 0.2);
    }
    .ronaldo-tag {
      font-size: 11px; font-weight: 900; letter-spacing: 1px;
      background: #dc2626; color: #fff; padding: 3px 8px; border-radius: 6px;
      display: inline-block; margin-bottom: 4px;
    }
    .ronaldo-name {
      font-size: 22px; font-weight: 900; letter-spacing: 0.5px;
      color: #f87171; text-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
    }

    /* Right Side: Messi (LM10 / Argentina Cyan & Gold) */
    .messi-card {
      background: rgba(56, 189, 248, 0.22);
      border: 3.5px solid #38bdf8;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.55), inset 0 0 14px rgba(56, 189, 248, 0.2);
    }
    .messi-tag {
      font-size: 11px; font-weight: 900; letter-spacing: 1px;
      background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 6px;
      display: inline-block; margin-bottom: 4px;
    }
    .messi-name {
      font-size: 22px; font-weight: 900; letter-spacing: 0.5px;
      color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    /* 3x Bigger Gift Icons & Clear Rules */
    .gift-big-icon {
      font-size: 54px;
      line-height: 1.1;
      margin: 4px 0 2px 0;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }
    .gift-rule-txt {
      font-size: 13px;
      font-weight: 800;
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pull-indicator {
      font-size: 14px;
      font-weight: 900;
      margin: 2px 0 4px 0;
    }
    .pull-red { color: #fca5a5; }
    .pull-blue { color: #bae6fd; }

    .score-badge {
      font-size: 28px;
      font-weight: 900;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 4px;
    }

    /* Center Timer */
    #timer-box {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #64748b;
      border-radius: 14px;
      padding: 8px 12px;
      text-align: center;
      color: white;
      margin-top: 10px;
    }
    #timer-label { font-size: 10px; color: #94a3b8; font-weight: 900; letter-spacing: 1px; }
    #timer-display { font-size: 22px; font-weight: 900; color: #f59e0b; }

    /* --- TENSION PROGRESS BAR --- */
    #meter-container {
      position: absolute; top: 245px; left: 4%; width: 92%; height: 28px;
      background: #111827; border-radius: 14px; overflow: hidden;
      display: flex; border: 2.5px solid #334155; z-index: 40;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    #ronaldo-meter {
      width: 50%; height: 100%;
      background: linear-gradient(90deg, #b91c1c, #ef4444);
      transition: width 0.15s ease;
    }
    #messi-meter {
      width: 50%; height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.15s ease;
    }

    /* Canvas */
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Victory Banner */
    #winner-banner {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: rgba(11, 15, 30, 0.96); padding: 28px 36px; border-radius: 28px;
      text-align: center; color: white; z-index: 200;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid #f59e0b;
    }
    #winner-title { font-size: 34px; font-weight: 900; margin-bottom: 8px; }
    #winner-sub { font-size: 17px; color: #94a3b8; }

    /* Hidden Testing Panel */
    #test-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; background: rgba(0,0,0,0.85); padding: 10px;
      border-radius: 12px; z-index: 100;
    }
    button {
      border: none; padding: 8px 12px; border-radius: 6px;
      font-weight: 900; cursor: pointer; font-size: 11px;
    }
    .btn-red { background: #ef4444; color: white; }
    .btn-blue { background: #38bdf8; color: black; }
  </style>
</head>
<body>
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <!-- Top Player Cards -->
  <div id="top-bar">
    <!-- RONALDO CARD -->
    <div class="player-card ronaldo-card">
      <div class="ronaldo-tag">CR7</div>
      <div class="ronaldo-name">RONALDO</div>
      <div class="gift-big-icon">🌹</div>
      <div class="gift-rule-txt">1 Rose</div>
      <div class="pull-indicator pull-red">◄ PULL LEFT</div>
      <div class="score-badge" id="ronaldo-score">0</div>
    </div>

    <div id="timer-box">
      <div id="timer-label">MATCH TIME</div>
      <div id="timer-display">02:00</div>
    </div>

    <!-- MESSI CARD -->
    <div class="player-card messi-card">
      <div class="messi-tag">LM10</div>
      <div class="messi-name">MESSI</div>
      <div class="gift-big-icon">🍩</div>
      <div class="gift-rule-txt">Other Gift</div>
      <div class="pull-indicator pull-blue">PULL RIGHT ►</div>
      <div class="score-badge" id="messi-score">0</div>
    </div>
  </div>

  <!-- Dynamic Tension Meter -->
  <div id="meter-container">
    <div id="ronaldo-meter"></div>
    <div id="messi-meter"></div>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- Victory Banner -->
  <div id="winner-banner">
    <div id="winner-title">🏆 RONALDO WINS! SIUUU!</div>
    <div id="winner-sub">Next match starting in 5 seconds...</div>
  </div>

  <!-- Hidden Test Controls -->
  <div id="test-panel">
    <button class="btn-red" onclick="testPull('ronaldo', 1)">+1 Rose (Ronaldo)</button>
    <button class="btn-red" onclick="testPull('ronaldo', 20)">+20 Ronaldo</button>
    <button class="btn-blue" onclick="testPull('messi', 1)">+1 Blue (Messi)</button>
    <button class="btn-blue" onclick="testPull('messi', 20)">+20 Messi</button>
    <button style="background:#64748b; color:white;" onclick="resetRound()">Reset</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 1080;
    const HEIGHT = 1920;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    // Game Physics State
    let ropeX = WIDTH / 2;
    let targetRopeX = WIDTH / 2;
    const ropeY = HEIGHT * 0.62;
    const maxOffset = 390;
    const minX = (WIDTH / 2) - maxOffset;
    const maxX = (WIDTH / 2) + maxOffset;

    let ronaldoWins = 0;
    let messiWins = 0;
    let roundActive = true;
    let roundTime = 120; // 2 minutes

    const pullers = [];

    // --- GAME LOOP ---
    function update() {
      ropeX += (targetRopeX - ropeX) * 0.12;

      // Update Meter Bar
      const ronaldoPercent = Math.max(5, Math.min(95, ((maxX - ropeX) / (maxOffset * 2)) * 100));
      document.getElementById('ronaldo-meter').style.width = `${ronaldoPercent}%`;
      document.getElementById('messi-meter').style.width = `${100 - ronaldoPercent}%`;

      // Check Match End Conditions
      if (roundActive) {
        if (ropeX <= minX + 15) {
          endRound('RONALDO');
        } else if (ropeX >= maxX - 15) {
          endRound('MESSI');
        }
      }

      render();
      requestAnimationFrame(update);
    }

    function render() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // --- Pitch Center Dashed Line ---
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.setLineDash([16, 16]);
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2, 290);
      ctx.lineTo(WIDTH / 2, HEIGHT - 100);
      ctx.stroke();
      ctx.setLineDash([]);

      // Ronaldo Goal Boundary (Left)
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(minX, ropeY - 150);
      ctx.lineTo(minX, ropeY + 150);
      ctx.stroke();

      // Messi Goal Boundary (Right)
      ctx.strokeStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(maxX, ropeY - 150);
      ctx.lineTo(maxX, ropeY + 150);
      ctx.stroke();

      // --- The Heavy Rope ---
      ctx.lineWidth = 22;
      ctx.strokeStyle = '#78350f';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(minX - 100, ropeY);
      ctx.lineTo(maxX + 100, ropeY);
      ctx.stroke();

      // Center Soccer Ball Indicator
      ctx.save();
      ctx.shadowBlur = 35;
      ctx.shadowColor = ropeX < WIDTH / 2 ? '#ef4444' : '#38bdf8';

      // Ball Outer Glow
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ropeX, ropeY, 32, 0, Math.PI * 2);
      ctx.fill();

      // Soccer Ball Pattern Details
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(ropeX, ropeY, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 4;
      ctx.strokeStyle = ropeX < WIDTH / 2 ? '#ef4444' : '#38bdf8';
      ctx.stroke();
      ctx.restore();

      // --- Draw Active Pullers (Avatars) ---
      for (let i = pullers.length - 1; i >= 0; i--) {
        const p = pullers[i];
        p.y += p.vy;
        p.life -= 0.015;

        if (p.life <= 0) {
          pullers.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.min(1, p.life * 2);

        // Rope connection string
        ctx.strokeStyle = p.team === 'ronaldo' ? 'rgba(239, 68, 68, 0.45)' : 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.anchorX, ropeY);
        ctx.stroke();

        // Avatar Body
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.team === 'ronaldo' ? '#ef4444' : '#38bdf8';
        ctx.fill();

        if (p.img && p.img.complete) {
          ctx.save();
          ctx.clip();
          ctx.drawImage(p.img, p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);
          ctx.restore();
        }

        // Circular Rim
        ctx.lineWidth = 4;
        ctx.strokeStyle = p.team === 'ronaldo' ? '#ef4444' : '#38bdf8';
        ctx.stroke();

        // Supporter Name
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - p.radius - 8);

        ctx.restore();
      }
    }

    // --- PULL LOGIC ---
    function triggerPull(team, coins, name, avatarUrl) {
      if (!roundActive) return;

      const pullPower = Math.min(180, 8 * coins);
      if (team === 'ronaldo') {
        targetRopeX = Math.max(minX, targetRopeX - pullPower);
      } else {
        targetRopeX = Math.min(maxX, targetRopeX + pullPower);
      }

      // Spawn visual pulling entity
      const anchorX = team === 'ronaldo' ? ropeX - 70 : ropeX + 70;
      const spawnX = team === 'ronaldo' ? anchorX - 80 - Math.random() * 80 : anchorX + 80 + Math.random() * 80;
      const spawnY = ropeY + (Math.random() * 130 - 65);

      const puller = {
        team: team,
        name: name,
        x: spawnX,
        y: spawnY,
        anchorX: anchorX,
        vy: -0.6,
        radius: coins >= 100 ? 46 : 34,
        life: 1.0,
        img: null
      };

      if (avatarUrl) {
        puller.img = new Image();
        puller.img.src = avatarUrl;
      }

      pullers.push(puller);
    }

    // --- ROUND RESOLUTION ---
    function endRound(winner) {
      roundActive = false;
      const banner = document.getElementById('winner-banner');
      const title = document.getElementById('winner-title');

      if (winner === 'RONALDO') {
        ronaldoWins++;
        document.getElementById('ronaldo-score').innerText = ronaldoWins;
        title.innerHTML = '🏆 RONALDO WINS! SIUUU! 🇵🇹';
        title.style.color = '#ef4444';
        banner.style.borderColor = '#ef4444';
      } else {
        messiWins++;
        document.getElementById('messi-score').innerText = messiWins;
        title.innerHTML = '🏆 MESSI WINS! GOAT! 🇦🇷';
        title.style.color = '#38bdf8';
        banner.style.borderColor = '#38bdf8';
      }

      banner.style.transform = 'translate(-50%, -50%) scale(1)';

      setTimeout(() => {
        resetRound();
      }, 5000);
    }

    function resetRound() {
      const banner = document.getElementById('winner-banner');
      banner.style.transform = 'translate(-50%, -50%) scale(0)';
      targetRopeX = WIDTH / 2;
      ropeX = WIDTH / 2;
      pullers.length = 0;
      roundTime = 120;
      roundActive = true;
    }

    // --- TIMER COUNTDOWN ---
    setInterval(() => {
      if (!roundActive) return;
      if (roundTime > 0) {
        roundTime--;
        const mins = String(Math.floor(roundTime / 60)).padStart(2, '0');
        const secs = String(roundTime % 60).padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
      } else {
        if (ropeX < WIDTH / 2) endRound('RONALDO');
        else if (ropeX > WIDTH / 2) endRound('MESSI');
        else resetRound();
      }
    }, 1000);

    // Hidden Testing Functions
    window.toggleTestPanel = function() {
      const p = document.getElementById('test-panel');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    };

    window.testPull = function(team, coins) {
      triggerPull(team, coins, team.toUpperCase(), null);
    };

    // --- WEBSOCKET EVENT LISTENER ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        const gift = (data.giftName || '').toLowerCase();
        // Rose sends points to Ronaldo (Left). Any other gift pulls for Messi (Right)!
        const team = gift.includes('rose') ? 'ronaldo' : 'messi';
        triggerPull(team, data.diamondCount || 1, data.username, data.avatar);
      }
    };

    update();
  </script>
</body>
</html>
