<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Plinko Live</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0c16;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- SIDEBAR CONTAINER POSITIONING --- */
    .rules-sidebar {
      position: absolute;
      top: 110px; /* Positioned in the shoulder gaps */
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 50;
      pointer-events: none;
    }
    #rules-left {
      left: 14px;
    }
    #rules-right {
      right: 14px;
    }

    /* --- BIGGER CARD STYLING --- */
    .rule-card {
      width: 115px;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    }

    /* Left Side: Cyan / Blue Glow */
    .card-blue {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
    }
    .badge-blue {
      background: #0284c7;
      color: #fff;
    }
    .ball-blue {
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    }

    /* Right Side: Gold / Orange Glow */
    .card-gold {
      border: 2px solid #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
    }
    .badge-gold {
      background: #d97706;
      color: #fff;
    }
    .ball-gold {
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* Card Details */
    .tier-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      padding: 3px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .gift-icon {
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .gift-name {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .arrow {
      font-size: 11px;
      color: #64748b;
      margin: 2px 0;
    }
    .ball-count {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* Hidden testing buttons */
    #test-panel {
      position: absolute; bottom: 15px; left: 15px; z-index: 100;
      display: none; gap: 8px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px;
    }
    button {
      background: #38bdf8; border: none; padding: 7px 10px;
      border-radius: 5px; font-weight: bold; cursor: pointer; color: #000; font-size: 11px;
    }

    /* Secret tap area at top of screen */
    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 70px; z-index: 60;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <!-- Secret Tap Zone to toggle test buttons -->
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <!-- LEFT SIDE: Basic & Multi-Drop -->
  <div class="rules-sidebar" id="rules-left">
    <div class="rule-card card-blue">
      <div class="tier-badge badge-blue">BASIC</div>
      <div class="gift-icon">🌹</div>
      <div class="gift-name">1 Rose</div>
      <div class="arrow">▼</div>
      <div class="ball-count ball-blue">1 BALL</div>
    </div>
    <div class="rule-card card-blue">
      <div class="tier-badge badge-blue">MULTI-DROP</div>
      <div class="gift-icon">🍩</div>
      <div class="gift-name">30 Coins</div>
      <div class="arrow">▼</div>
      <div class="ball-count ball-blue">5 BALLS</div>
    </div>
  </div>

  <!-- RIGHT SIDE: Epic & Legendary -->
  <div class="rules-sidebar" id="rules-right">
    <div class="rule-card card-gold">
      <div class="tier-badge badge-gold">EPIC TIER</div>
      <div class="gift-icon">🎉</div>
      <div class="gift-name">100 Coins</div>
      <div class="arrow">▼</div>
      <div class="ball-count ball-gold">15 BALLS</div>
    </div>
    <div class="rule-card card-gold">
      <div class="tier-badge badge-gold">LEGENDARY</div>
      <div class="gift-icon">🦁</div>
      <div class="gift-name">1000+ Coins</div>
      <div class="arrow">▼</div>
      <div class="ball-count ball-gold">150 BALLS</div>
    </div>
  </div>

  <div id="canvas-box"></div>

  <div id="test-panel">
    <button onclick="testDrop(1)">Test 1</button>
    <button onclick="testDrop(30)">Test 30</button>
    <button onclick="testDrop(100)">Test 100</button>
    <button onclick="testDrop(1000)">Test 150</button>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    const width = 1080;
    const height = 1920;

    const engine = Engine.create({ gravity: { y: 1.2 } });
    const world = engine.world;

    const render = Render.create({
      element: document.getElementById('canvas-box'),
      engine: engine,
      options: { width: width, height: height, wireframes: false, background: '#0b0c16' }
    });

    Render.run(render);
    Runner.run(Runner.create(), engine);

    // Boundary walls
    Composite.add(world, [
      Bodies.rectangle(-10, height / 2, 20, height, { isStatic: true }),
      Bodies.rectangle(width + 10, height / 2, 20, height, { isStatic: true })
    ]);

    // Pegs
    const rows = 11;
    const startY = 350;
    const spacingY = 85;

    for (let r = 0; r < rows; r++) {
      const count = r + 3;
      const spacingX = 75;
      const startX = (width - (count - 1) * spacingX) / 2;

      for (let c = 0; c < count; c++) {
        Composite.add(world, Bodies.circle(startX + c * spacingX, startY + r * spacingY, 10, {
          isStatic: true,
          restitution: 0.8,
          render: { fillStyle: '#38bdf8' }
        }));
      }
    }

    // Bottom Bins
    const mults = [50, 10, 2, 0.5, 2, 10, 50];
    const binW = width / mults.length;
    const binY = 1600;

    mults.forEach((m, i) => {
      if (i > 0) {
        Composite.add(world, Bodies.rectangle(i * binW, binY - 30, 8, 120, {
          isStatic: true,
          render: { fillStyle: '#334155' }
        }));
      }
      const sensor = Bodies.rectangle(i * binW + binW / 2, binY + 40, binW - 8, 48, {
        isStatic: true,
        isSensor: true,
        label: 'sensor',
        render: { fillStyle: m >= 10 ? '#ef4444' : (m >= 2 ? '#f59e0b' : '#10b981') }
      });
      Composite.add(world, sensor);
    });

    Events.on(render, 'afterRender', () => {
      const ctx = render.context;
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';

      mults.forEach((m, i) => {
        const x = i * binW + binW / 2;
        const y = binY + 40;
        ctx.fillText(`${m}x`, x, y);
      });
    });

    Events.on(engine, 'collisionStart', (e) => {
      e.pairs.forEach(({ bodyA, bodyB }) => {
        const ball = bodyA.label === 'ball' ? bodyA : (bodyB.label === 'ball' ? bodyB : null);
        const sensor = bodyA.label === 'sensor' ? bodyA : (bodyB.label === 'sensor' ? bodyB : null);
        if (ball && sensor && !ball.consumed) {
          ball.consumed = true;
          setTimeout(() => Composite.remove(world, ball), 100);
        }
      });
    });

    function dropAvatar(name, avatarUrl, coins) {
      let count = 1;
      if (coins >= 1000) count = 150;
      else if (coins >= 100) count = 15;
      else if (coins >= 30) count = 5;
      else count = 1;

      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const x = (width / 2) + (Math.random() * 80 - 40);
          const ball = Bodies.circle(x, 100, 26, {
            restitution: 0.7,
            friction: 0.05,
            label: 'ball',
            render: avatarUrl ? {
              sprite: { texture: avatarUrl, xScale: 0.5, yScale: 0.5 }
            } : { fillStyle: '#f59e0b' }
          });
          Composite.add(world, ball);
        }, i * 150);
      }
    }

    window.toggleTestPanel = function() {
      const panel = document.getElementById('test-panel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    };

    window.testDrop = function(coins) {
      dropAvatar("Tester", null, coins);
    };

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        dropAvatar(data.username, data.avatar, data.diamondCount);
      }
    };
  </script>
</body>
</html>
