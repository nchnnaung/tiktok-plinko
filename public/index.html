<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Plinko</title>
  <style>
    body { margin: 0; background: #0b0c16; overflow: hidden; font-family: sans-serif; }
    #canvas-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- Neon Sidebar Gift Rules (Placed in Vacant Left/Right Gaps) --- */
    .sidebar-rules {
      position: absolute;
      top: 130px; /* Aligned perfectly to the upper-middle side voids */
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;
    }
    
    #rules-left { left: 24px; }
    #rules-right { right: 24px; }

    /* Basic & Epic Box Stylings */
    .rule-card {
      background: rgba(18, 20, 38, 0.85);
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      padding: 10px 14px;
      width: 145px;
      color: white;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .rule-card.special {
      border-color: #f59e0b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.35);
    }

    .rule-card .header-title {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .rule-card .header-title.basic { color: #38bdf8; text-shadow: 0 0 5px rgba(56, 189, 248, 0.5); }
    .rule-card .header-title.epic { color: #f59e0b; text-shadow: 0 0 5px rgba(245, 158, 11, 0.5); }

    .rule-card .icon { font-size: 28px; display: block; margin-bottom: 2px; }
    .rule-card .gift-name { font-size: 13px; font-weight: 700; color: #94a3b8; }
    .rule-card .equals { font-size: 12px; font-weight: 600; color: #475569; margin: 2px 0; }
    .rule-card .outcome { font-size: 15px; font-weight: 900; color: #38bdf8; }
    .rule-card.special .outcome { color: #f59e0b; }

    /* Hidden testing options panel */
    #test-panel {
      position: absolute; bottom: 20px; left: 20px; z-index: 100;
      display: none; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 8px;
    }
    button {
      background: #38bdf8; border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; color: #000;
      font-size: 12px;
    }

    /* Secret double-tap zone */
    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 75px; z-index: 60;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <!-- Hidden Toggler top-trigger zone -->
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <!-- Left Sidebar (Basic Tier) -->
  <div class="sidebar-rules" id="rules-left">
    <div class="rule-card">
      <div class="header-title basic">🎁 BASIC TIER</div>
      <span class="icon">🌹</span>
      <div class="gift-name">1 Rose</div>
      <div class="equals">=</div>
      <div class="outcome">1 BALL</div>
    </div>
    <div class="rule-card">
      <div class="header-title basic">🍩 MULTI-DROP</div>
      <span class="icon">🍩</span>
      <div class="gift-name">30 Coins</div>
      <div class="equals">=</div>
      <div class="outcome">5 BALLS</div>
    </div>
  </div>

  <!-- Right Sidebar (Epic/Legendary Tier) -->
  <div class="sidebar-rules" id="rules-right">
    <div class="rule-card special">
      <div class="header-title epic">🔥 EPIC TIER</div>
      <span class="icon">🎉</span>
      <div class="gift-name">100 Coins</div>
      <div class="equals">=</div>
      <div class="outcome">15 BALLS</div>
    </div>
    <div class="rule-card special">
      <div class="header-title epic">🦁 LEGENDARY</div>
      <span class="icon">🦁</span>
      <div class="gift-name">1000+ Coins</div>
      <div class="equals">=</div>
      <div class="outcome">150 BALLS</div>
    </div>
  </div>

  <div id="canvas-box"></div>

  <!-- Updated tester triggers for our new sizes -->
  <div id="test-panel">
    <button onclick="testDrop(1)">Test 1</button>
    <button onclick="testDrop(30)">Test 30</button>
    <button onclick="testDrop(100)">Test 100</button>
    <button onclick="testDrop(1000)">Test 1000</button>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    const width = 1080;
    const height = 1920;

    const engine = Engine.create({ gravity: { y: 1.2 } });
    const world = engine.world;

    const render = Render.create({
      element: document.getElementById('canvas-box'),
      engine: engine,
      options: { width: width, height: height, wireframes: false, background: '#0b0c16' }
    });

    Render.run(render);
    Runner.run(Runner.create(), engine);

    Composite.add(world, [
      Bodies.rectangle(-10, height / 2, 20, height, { isStatic: true }),
      Bodies.rectangle(width + 10, height / 2, 20, height, { isStatic: true })
    ]);

    const rows = 11;
    const startY = 350;
    const spacingY = 85;

    for (let r = 0; r < rows; r++) {
      const count = r + 3;
      const spacingX = 75;
      const startX = (width - (count - 1) * spacingX) / 2;

      for (let c = 0; c < count; c++) {
        Composite.add(world, Bodies.circle(startX + c * spacingX, startY + r * spacingY, 10, {
          isStatic: true,
          restitution: 0.8,
          render: { fillStyle: '#38bdf8' }
        }));
      }
    }

    const mults = [50, 10, 2, 0.5, 2, 10, 50];
    const binW = width / mults.length;
    const binY = 1600;

    mults.forEach((m, i) => {
      if (i > 0) {
        Composite.add(world, Bodies.rectangle(i * binW, binY - 30, 8, 120, {
          isStatic: true,
          render: { fillStyle: '#334155' }
        }));
      }
      const sensor = Bodies.rectangle(i * binW + binW / 2, binY + 40, binW - 8, 48, {
        isStatic: true,
        isSensor: true,
        label: 'sensor',
        render: { fillStyle: m >= 10 ? '#ef4444' : (m >= 2 ? '#f59e0b' : '#10b981') }
      });
      Composite.add(world, sensor);
    });

    Events.on(render, 'afterRender', () => {
      const ctx = render.context;
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';

      mults.forEach((m, i) => {
        const x = i * binW + binW / 2;
        const y = binY + 40;
        ctx.fillText(`${m}x`, x, y);
      });
    });

    Events.on(engine, 'collisionStart', (e) => {
      e.pairs.forEach(({ bodyA, bodyB }) => {
        const ball = bodyA.label === 'ball' ? bodyA : (bodyB.label === 'ball' ? bodyB : null);
        const sensor = bodyA.label === 'sensor' ? bodyA : (bodyB.label === 'sensor' ? bodyB : null);
        if (ball && sensor && !ball.consumed) {
          ball.consumed = true;
          setTimeout(() => Composite.remove(world, ball), 100);
        }
      });
    });

    function dropAvatar(name, avatarUrl, coins) {
      let count = 1;
      
      // Match the drop logic perfectly with the side rule sizes!
      if (coins >= 1000) count = 150;
      else if (coins >= 100) count = 15;
      else if (coins >= 30) count = 5;
      else count = 1;

      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const x = (width / 2) + (Math.random() * 80 - 40);
          const ball = Bodies.circle(x, 100, 26, {
            restitution: 0.7,
            friction: 0.05,
            label: 'ball',
            render: avatarUrl ? {
              sprite: { texture: avatarUrl, xScale: 0.5, yScale: 0.5 }
            } : { fillStyle: '#f59e0b' }
          });
          Composite.add(world, ball);
        }, i * 150);
      }
    }

    window.toggleTestPanel = function() {
      const panel = document.getElementById('test-panel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    };

    window.testDrop = function(coins) {
      dropAvatar("Tester", null, coins);
    };

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        dropAvatar(data.username, data.avatar, data.diamondCount);
      }
    };
  </script>
</body>
</html>
