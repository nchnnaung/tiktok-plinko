<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#c8c8cf">
  <title>3Hands - Real Mechanical CNC Plotter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #b5b5be;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      height: 100vh;
      width: 100vw;
    }

    #secret-tap-zone {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px; z-index: 100;
    }

    #game-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }

    /* --- TOP OVERLAY HUD --- */
    #top-bar {
      position: absolute; top: 16px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0 16px; z-index: 50; pointer-events: none;
    }

    .brand-box {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(8px);
    }
    .brand-title {
      font-size: 15px; font-weight: 900; color: #0f172a; letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 9px; font-weight: 800; color: #64748b; letter-spacing: 0.5px;
    }

    .stats-pill {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      text-align: right;
      backdrop-filter: blur(8px);
    }
    .stats-label { font-size: 9px; font-weight: 800; color: #64748b; text-transform: uppercase; }
    .stats-num { font-size: 16px; font-weight: 900; color: #1e3a8a; }

    /* Bottom Guide */
    #gift-guide {
      position: absolute; bottom: 18px; right: 14px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 14px; padding: 7px 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      z-index: 50; pointer-events: none;
      display: flex; flex-direction: column; gap: 4px;
      backdrop-filter: blur(8px);
    }
    .guide-item {
      font-size: 11px; font-weight: 900; color: #0f172a; display: flex; align-items: center; gap: 6px;
    }
    .guide-item span { color: #1e3a8a; }

    /* Secret Test Panel */
    #test-panel {
      position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
      display: none; gap: 6px; background: rgba(15, 23, 42, 0.95); padding: 8px 12px;
      border-radius: 14px; z-index: 150; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    button {
      border: none; padding: 7px 11px; border-radius: 6px;
      font-weight: 900; cursor: pointer; font-size: 11px;
    }
    .btn-fs { background: #22c55e; color: #000; }
    .btn-lane { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <div id="secret-tap-zone" onclick="toggleTestPanel()"></div>

  <div id="top-bar">
    <div class="brand-box">
      <div class="brand-title">3Hands Studio ✍️</div>
      <div class="brand-sub">CNC REAL-TIME PLOTTER</div>
    </div>
    <div class="stats-pill">
      <div class="stats-label">TOTAL PRINTS</div>
      <div class="stats-num" id="total-prints">0</div>
    </div>
  </div>

  <div id="gift-guide">
    <div class="guide-item">🌹 1 Rose = <span>Classic Crest</span></div>
    <div class="guide-item">🍩 30 Coins = <span>Royal Seal</span></div>
    <div class="guide-item">🎉 100 Coins = <span>Imperial Crown</span></div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="test-panel">
    <button class="btn-fs" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button class="btn-lane" onclick="testPrint(0)">Arm 1</button>
    <button class="btn-lane" onclick="testPrint(1)">Arm 2</button>
    <button class="btn-lane" onclick="testPrint(2)">Arm 3</button>
    <button style="background:#f59e0b; color:#000;" onclick="testPrintRandom()">Auto-Route</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 1080;
    const HEIGHT = 1920;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let totalPrintsCount = 0;
    let animFrame = 0;

    // --- 3 CONVEYOR LANES GEOMETRY ---
    const NUM_LANES = 3;
    const MARGIN_X = 40;
    const TOTAL_WIDTH = WIDTH - MARGIN_X * 2;
    const LANE_WIDTH = 300;
    const LANE_SPACING = (TOTAL_WIDTH - LANE_WIDTH * NUM_LANES) / (NUM_LANES - 1);

    const ITEM_HEIGHT = 310;
    const PRINT_Y = 320; // Exact Y center where pen draws on paper

    const lanes = [];
    for (let i = 0; i < NUM_LANES; i++) {
      const x = MARGIN_X + i * (LANE_WIDTH + LANE_SPACING);
      lanes.push({
        index: i,
        x: x,
        centerX: x + LANE_WIDTH / 2,
        queue: [],
        items: [],
        activeJob: null,
        toolpath: [],
        pathIndex: 0,
        scrollOffset: 0,
        targetScrollOffset: 0,
        toolhead: {
          x: x + LANE_WIDTH / 2,
          y: PRINT_Y,
          penDown: false,
          liftZ: 0
        }
      });
    }

    // --- PROCEDURAL G-CODE VECTOR TOOLPATH GENERATOR ---
    function buildPlotterToolpath(cx, cy) {
      const pts = [];

      // 1. Crown / Top Finial Flourish
      pts.push({ x: cx - 25, y: cy - 120, penDown: false });
      pts.push({ x: cx - 18, y: cy - 132, penDown: true });
      pts.push({ x: cx, y: cy - 124, penDown: true });
      pts.push({ x: cx + 18, y: cy - 132, penDown: true });
      pts.push({ x: cx + 25, y: cy - 120, penDown: true });
      pts.push({ x: cx, y: cy - 110, penDown: true });
      pts.push({ x: cx - 25, y: cy - 120, penDown: true });

      // 2. Left Baroque Leaf Spiral
      pts.push({ x: cx - 80, y: cy - 40, penDown: false });
      for (let t = 0; t <= Math.PI * 1.5; t += 0.15) {
        const rad = 25 - t * 5;
        pts.push({
          x: cx - 85 + Math.cos(t) * rad,
          y: cy - 40 + Math.sin(t) * rad,
          penDown: true
        });
      }

      // 3. Right Baroque Leaf Spiral
      pts.push({ x: cx + 80, y: cy - 40, penDown: false });
      for (let t = 0; t <= Math.PI * 1.5; t += 0.15) {
        const rad = 25 - t * 5;
        pts.push({
          x: cx + 85 - Math.cos(t) * rad,
          y: cy - 40 + Math.sin(t) * rad,
          penDown: true
        });
      }

      // 4. Outer Filigree Oval Rim (Full 360 Loop)
      pts.push({ x: cx + 84, y: cy, penDown: false });
      for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.08) {
        pts.push({
          x: cx + Math.cos(a) * 84,
          y: cy + Math.sin(a) * 104,
          penDown: true
        });
      }

      // 5. Beaded Inner Oval Rim
      pts.push({ x: cx + 76, y: cy, penDown: false });
      for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.1) {
        pts.push({
          x: cx + Math.cos(a) * 76,
          y: cy + Math.sin(a) * 96,
          penDown: true
        });
      }

      // 6. Avatar Infill Shading (Dense Horizontal CNC Scan Lines across the portrait)
      const avatarR = 56;
      for (let sy = -avatarR + 4; sy <= avatarR - 4; sy += 7) {
        const chord = Math.sqrt(avatarR * avatarR - sy * sy);
        // Left to right stroke
        pts.push({ x: cx - chord, y: cy + sy, penDown: false });
        pts.push({ x: cx + chord, y: cy + sy, penDown: true });
      }

      // 7. Circular Medallion Frame
      pts.push({ x: cx + avatarR, y: cy, penDown: false });
      for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.12) {
        pts.push({
          x: cx + Math.cos(a) * avatarR,
          y: cy + Math.sin(a) * avatarR,
          penDown: true
        });
      }

      // 8. Ribbon Nameplate Banner (Bottom Box)
      const rw = 88;
      const rh = 13;
      const ry = cy + 112;
      pts.push({ x: cx - rw, y: ry - rh, penDown: false });
      pts.push({ x: cx + rw, y: ry - rh, penDown: true });
      pts.push({ x: cx + rw + 8, y: ry, penDown: true });
      pts.push({ x: cx + rw, y: ry + rh, penDown: true });
      pts.push({ x: cx - rw, y: ry + rh, penDown: true });
      pts.push({ x: cx - rw - 8, y: ry, penDown: true });
      pts.push({ x: cx - rw, y: ry - rh, penDown: true });

      // 9. Signature / Username Underline Stroke
      pts.push({ x: cx - 65, y: ry + 6, penDown: false });
      pts.push({ x: cx + 65, y: ry + 6, penDown: true });

      return pts;
    }

    // --- GAME ENGINE LOOP ---
    function update() {
      animFrame++;

      for (const lane of lanes) {
        // Conveyor Paper Advance
        lane.scrollOffset += (lane.targetScrollOffset - lane.scrollOffset) * 0.1;

        // Check Queue
        if (!lane.activeJob && lane.queue.length > 0) {
          startPrintingJob(lane, lane.queue.shift());
        }

        // Active Printing Execution
        if (lane.activeJob) {
          // Drawing speed: 2 toolpath points per animation frame
          const stepSpeed = 2;
          lane.pathIndex = Math.min(lane.toolpath.length - 1, lane.pathIndex + stepSpeed);

          const targetPt = lane.toolpath[lane.pathIndex];

          // Stepper motor micro-jitter for tactile realism
          const jitterX = targetPt.penDown ? (Math.random() - 0.5) * 0.8 : 0;
          const jitterY = targetPt.penDown ? (Math.random() - 0.5) * 0.8 : 0;

          lane.toolhead.x = targetPt.x + jitterX;
          lane.toolhead.y = targetPt.y + jitterY;
          lane.toolhead.penDown = targetPt.penDown;
          lane.toolhead.liftZ = targetPt.penDown ? 0 : 8; // Pen lifts up when moving

          // Job Finished!
          if (lane.pathIndex >= lane.toolpath.length - 1) {
            completePrintingJob(lane);
          }
        } else {
          // Idle park head
          lane.toolhead.x += (lane.centerX - lane.toolhead.x) * 0.1;
          lane.toolhead.y += (PRINT_Y - lane.toolhead.y) * 0.1;
          lane.toolhead.penDown = false;
          lane.toolhead.liftZ = 12;
        }

        // Prune off-screen items
        for (let i = lane.items.length - 1; i >= 0; i--) {
          if (lane.items[i].y + lane.scrollOffset > HEIGHT + 150) {
            lane.items.splice(i, 1);
          }
        }
      }

      render();
      requestAnimationFrame(update);
    }

    function render() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // 1. Studio Concrete Workbench Background
      ctx.fillStyle = '#c5c5ce';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Background subtle mechanical shadow
      const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      grad.addColorStop(0, 'rgba(0,0,0,0.12)');
      grad.addColorStop(1, 'rgba(0,0,0,0.02)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 2. Continuous Parchment Rolls & Printed Artwork
      for (const lane of lanes) {
        drawParchmentRoll(lane);
      }

      // 3. Top Aluminum V-Slot Rail & Stepper Drive Gantry
      drawTopGantryStructure();

      // 4. 3D Mechanical CNC Extruder Heads (Drawn in front with depth)
      for (const lane of lanes) {
        draw3DExtruderHead(lane);
      }
    }

    // --- DRAW CONTINUOUS PAPER ROLL & DRAWN INK ---
    function drawParchmentRoll(lane) {
      ctx.save();

      // Deep Shadow behind paper strip
      ctx.shadowBlur = 22;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.22)';
      ctx.shadowOffsetX = 6;
      ctx.shadowOffsetY = 10;
      ctx.fillStyle = '#fafafc'; // Crisp bright parchment
      ctx.fillRect(lane.x, 90, LANE_WIDTH, HEIGHT - 90);
      ctx.restore();

      // Paper Guide Rails & Perforations
      ctx.fillStyle = '#d1d5db';
      ctx.fillRect(lane.x, 90, 5, HEIGHT - 90);
      ctx.fillRect(lane.x + LANE_WIDTH - 5, 90, 5, HEIGHT - 90);

      // Micro paper grain lines
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.025)';
      ctx.lineWidth = 1;
      for (let y = 100; y < HEIGHT; y += 45) {
        ctx.beginPath();
        ctx.moveTo(lane.x, y);
        ctx.lineTo(lane.x + LANE_WIDTH, y);
        ctx.stroke();
      }

      // Draw Completed Printed Items (Scrolling Down)
      for (const item of lane.items) {
        const renderY = item.y + lane.scrollOffset;
        if (renderY > 70 && renderY < HEIGHT + 120) {
          drawFullPortrait(lane.centerX, renderY, item);
        }
      }

      // Draw Active In-Progress Print (Toolpath lines drawn up to pathIndex)
      if (lane.activeJob) {
        drawProgressiveToolpath(lane);
      }
    }

    // --- DRAW VECTOR STROKES IN REAL-TIME AS PEN MOVES ---
    function drawProgressiveToolpath(lane) {
      const job = lane.activeJob;
      const pts = lane.toolpath;
      const maxIdx = lane.pathIndex;

      ctx.save();

      // Embossed Dark Navy/Blue Ink Color
      const inkColor = job.tier === 'royal' ? '#0f265c' : (job.tier === 'gold' ? '#78350f' : '#1e293b');
      ctx.strokeStyle = inkColor;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 2.4;

      // Draw vector lines sequentially
      ctx.beginPath();
      let isDrawing = false;

      for (let i = 0; i <= maxIdx; i++) {
        const pt = pts[i];
        if (!pt.penDown) {
          isDrawing = false;
        } else {
          if (!isDrawing) {
            ctx.moveTo(pt.x, pt.y);
            isDrawing = true;
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
        }
      }
      ctx.stroke();

      // Progressively reveal the sender's avatar underneath the hatch lines
      const hatchStart = Math.floor(pts.length * 0.45);
      if (maxIdx > hatchStart) {
        const revealPct = (maxIdx - hatchStart) / (pts.length - hatchStart);
        const avatarR = 56;
        ctx.save();
        ctx.beginPath();
        ctx.arc(lane.centerX, PRINT_Y, avatarR, 0, Math.PI * 2);
        ctx.clip();

        // Reveal wipe following hatch progress
        ctx.beginPath();
        ctx.rect(lane.centerX - avatarR, PRINT_Y - avatarR, avatarR * 2, avatarR * 2 * revealPct);
        ctx.clip();

        if (job.img && job.img.complete) {
          ctx.drawImage(job.img, lane.centerX - avatarR, PRINT_Y - avatarR, avatarR * 2, avatarR * 2);

          // Deep Blue Ink sketch glaze
          ctx.fillStyle = 'rgba(15, 38, 92, 0.28)';
          ctx.fillRect(lane.centerX - avatarR, PRINT_Y - avatarR, avatarR * 2, avatarR * 2);
        } else {
          ctx.fillStyle = '#f1f5f9';
          ctx.fillRect(lane.centerX - avatarR, PRINT_Y - avatarR, avatarR * 2, avatarR * 2);
          ctx.fillStyle = inkColor;
          ctx.font = '900 38px serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(job.username.charAt(0).toUpperCase(), lane.centerX, PRINT_Y);
        }
        ctx.restore();
      }

      // Draw username on the ribbon when reached
      if (maxIdx >= pts.length - 6) {
        ctx.fillStyle = inkColor;
        ctx.font = 'bold 13px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const cleanName = job.username.length > 13 ? job.username.substring(0, 12) + '…' : job.username;
        ctx.fillText(`@${cleanName}`, lane.centerX, PRINT_Y + 112);
      }

      ctx.restore();
    }

    // --- DRAW FINISHED ENGRAVED PORTRAIT (POST-PRINT) ---
    function drawFullPortrait(cx, cy, job) {
      ctx.save();

      const inkColor = job.tier === 'royal' ? '#0f265c' : (job.tier === 'gold' ? '#78350f' : '#1e293b');
      ctx.strokeStyle = inkColor;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Outer Ornate Oval
      ctx.beginPath();
      ctx.ellipse(cx, cy, 84, 104, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Inner Beaded Rim
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.ellipse(cx, cy, 76, 96, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Top Crown / Crest
      ctx.fillStyle = inkColor;
      ctx.font = '22px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(job.tier === 'royal' ? '👑' : '⚜️', cx, cy - 124);

      // Side Flourish
      ctx.font = '22px serif';
      ctx.fillText('❧', cx - 88, cy - 40);
      ctx.fillText('☙', cx + 88, cy - 40);

      // Avatar
      const avatarR = 56;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, avatarR, 0, Math.PI * 2);
      ctx.clip();

      if (job.img && job.img.complete) {
        ctx.drawImage(job.img, cx - avatarR, cy - avatarR, avatarR * 2, avatarR * 2);
        ctx.fillStyle = 'rgba(15, 38, 92, 0.28)';
        ctx.fillRect(cx - avatarR, cy - avatarR, avatarR * 2, avatarR * 2);
      } else {
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(cx - avatarR, cy - avatarR, avatarR * 2, avatarR * 2);
        ctx.fillStyle = inkColor;
        ctx.font = '900 38px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(job.username.charAt(0).toUpperCase(), cx, cy);
      }
      ctx.restore();

      // Avatar Outer Rim
      ctx.lineWidth = 2;
      ctx.strokeStyle = inkColor;
      ctx.beginPath();
      ctx.arc(cx, cy, avatarR, 0, Math.PI * 2);
      ctx.stroke();

      // Ribbon
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(cx - 88, cy + 99, 176, 26, 6);
      ctx.fill();
      ctx.stroke();

      // Ribbon Username
      ctx.fillStyle = inkColor;
      ctx.font = 'bold 13px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cleanName = job.username.length > 13 ? job.username.substring(0, 12) + '…' : job.username;
      ctx.fillText(`@${cleanName}`, cx, cy + 112);

      ctx.restore();
    }

    // --- TOP GANTRY & MOTOR TIMING BELT ---
    function drawTopGantryStructure() {
      ctx.save();

      // Aluminum V-Slot Extrusion Crossbeam
      const beamGrad = ctx.createLinearGradient(0, 75, 0, 105);
      beamGrad.addColorStop(0, '#64748b');
      beamGrad.addColorStop(0.3, '#94a3b8');
      beamGrad.addColorStop(0.7, '#475569');
      beamGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = beamGrad;
      ctx.fillRect(0, 75, WIDTH, 30);

      // Grooved Timing Belt
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 88, WIDTH, 4);

      ctx.restore();
    }

    // --- 3D MECHANICAL TOOLHEAD (THE PRINTER ARM) ---
    function draw3DExtruderHead(lane) {
      const hx = lane.toolhead.x;
      const hy = lane.toolhead.y;
      const lift = lane.toolhead.liftZ;

      ctx.save();

      // 1. DYNAMIC DROP SHADOW (Projected on paper, moves with head height)
      ctx.save();
      ctx.shadowBlur = lift > 2 ? 26 : 14;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowOffsetX = 12 + lift * 0.8;
      ctx.shadowOffsetY = 14 + lift * 0.8;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.roundRect(hx - 36, hy - 40, 72, 54, 8);
      ctx.fill();
      ctx.restore();

      // 2. Dual Polished Chrome Linear Shafts (Connecting top rail to head)
      const shaftGrad = ctx.createLinearGradient(hx - 22, 0, hx + 22, 0);
      shaftGrad.addColorStop(0, '#64748b');
      shaftGrad.addColorStop(0.5, '#f8fafc');
      shaftGrad.addColorStop(1, '#475569');

      ctx.fillStyle = shaftGrad;
      ctx.fillRect(hx - 24, 105, 6, hy - 145);
      ctx.fillRect(hx + 18, 105, 6, hy - 145);

      // 3. Flexible Black Cable Harness Loop (Reaching out from top)
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hx, 105);
      ctx.bezierCurveTo(hx - 45, 140, hx - 55, hy - 80, hx - 12, hy - 40);
      ctx.stroke();

      // 4. Stepper Motor Black Housing Block (3D Beveled Box)
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(hx - 36, hy - 42, 72, 46, 8);
      ctx.fill();

      // Silver Motor Plate Lid
      ctx.fillStyle = '#334155';
      ctx.fillRect(hx - 28, hy - 36, 56, 12);

      // 4 Corner Motor Screws
      ctx.fillStyle = '#94a3b8';
      const screwPositions = [
        [-30, -38], [24, -38], [-30, -4], [24, -4]
      ];
      for (const [sx, sy] of screwPositions) {
        ctx.beginPath();
        ctx.arc(hx + sx + 3, hy + sy + 3, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Cooling Fan Grill Vents
      ctx.fillStyle = '#0f172a';
      for (let r = 0; r < 3; r++) {
        ctx.fillRect(hx - 18, hy - 18 + r * 5, 36, 2.5);
      }

      // 5. Aluminum Heater Block
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(hx - 12, hy + 4, 24, 10);

      // 6. Machined Brass Nozzle Tip
      const brassGrad = ctx.createLinearGradient(hx - 8, hy + 14, hx + 8, hy + 24);
      brassGrad.addColorStop(0, '#f59e0b');
      brassGrad.addColorStop(0.5, '#fef08a');
      brassGrad.addColorStop(1, '#b45309');
      ctx.fillStyle = brassGrad;
      ctx.beginPath();
      ctx.moveTo(hx - 8, hy + 14);
      ctx.lineTo(hx + 8, hy + 14);
      ctx.lineTo(hx, hy + 26);
      ctx.closePath();
      ctx.fill();

      // 7. Active Ink Contact / Laser Plasma Glow Point
      if (lane.toolhead.penDown) {
        ctx.save();
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#2563eb';
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(hx, hy + 26, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    // --- JOB MANAGEMENT ---
    function routeIncomingGift(username, avatarUrl, coins) {
      let tier = 'silver';
      if (coins >= 100) tier = 'royal';
      else if (coins >= 30) tier = 'gold';

      const job = {
        username: username,
        avatarUrl: avatarUrl,
        tier: tier,
        img: null
      };

      if (avatarUrl) {
        job.img = new Image();
        job.img.src = avatarUrl;
      }

      // Route to lane with shortest work backlog
      let bestLane = lanes[0];
      let minLoad = Infinity;
      for (const l of lanes) {
        const load = l.queue.length + (l.activeJob ? 1 : 0);
        if (load < minLoad) {
          minLoad = load;
          bestLane = l;
        }
      }

      bestLane.queue.push(job);
    }

    function startPrintingJob(lane, job) {
      lane.activeJob = job;
      lane.toolpath = buildPlotterToolpath(lane.centerX, PRINT_Y);
      lane.pathIndex = 0;
    }

    function completePrintingJob(lane) {
      lane.items.unshift({
        ...lane.activeJob,
        y: PRINT_Y - lane.scrollOffset
      });

      // Shift paper roll down smoothly by 1 full portrait length
      lane.targetScrollOffset += ITEM_HEIGHT;

      lane.activeJob = null;
      lane.pathIndex = 0;

      totalPrintsCount++;
      document.getElementById('total-prints').innerText = totalPrintsCount;
    }

    // --- TESTING CONTROLS ---
    window.toggleTestPanel = function() {
      const p = document.getElementById('test-panel');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    };

    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    const mockNames = ['Lissandraa', 'Sofia Fillmon', 'AU', 'REZA', 'Djeki', 'Rin_Stance'];

    window.testPrint = function(laneIndex) {
      const name = mockNames[Math.floor(Math.random() * mockNames.length)];
      lanes[laneIndex].queue.push({
        username: name,
        avatarUrl: null,
        tier: Math.random() > 0.5 ? 'gold' : 'royal',
        img: null
      });
    };

    window.testPrintRandom = function() {
      const name = mockNames[Math.floor(Math.random() * mockNames.length)];
      routeIncomingGift(name, null, 1);
    };

    // --- LIVE WEBSOCKET LISTENER ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'GIFT') {
        const coins = data.diamondCount || 1;
        routeIncomingGift(data.username, data.avatar, coins);
      }
    };

    update();
  </script>
</body>
</html>
